<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear recuerdo | ReQRdito</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/main.css?v=2026">
</head>

<body class="crear-body">

<div class="crear-card">

  <h1>Crear tu recuerdo</h1>
  <p>Subí un audio y transformalo en un QR eterno</p>

  <form id="crearRecuerdoForm">

    <div class="form-group">
      <label for="nombre">Nombre del recuerdo</label>
      <input
        type="text"
        id="nombre"
        placeholder="Ingresa el nombre del recuerdo"
        required
      >
    </div>

    <div class="form-group">
      <label for="audio">Grabar o seleccionar audio</label>
      <input
        type="file"
        id="audio"
        accept="audio/*"
        required
      >
      <small>
        🎧 Audios de hasta <b>10 MB</b> (≈ 5 minutos)<br>
        En celular se abrirá el grabador automáticamente
      </small>
    </div>

    <div class="preescucha">
      <audio id="previewAudio" controls></audio>
    </div>

    <button type="button" id="btnContinuar">
      Continuar
    </button>
  </form>

  <p id="estado"></p>
</div>

<!-- 🔐 OVERLAY LOGIN GOOGLE -->
<div id="loginOverlay" class="login-overlay oculto">
  <div class="login-card">
    <h2>Iniciá sesión para continuar</h2>
    <p>Usá tu cuenta de Google para guardar tu recuerdo</p>

    <div id="googleLogin"></div>

    <button id="cancelLogin" class="btn-link">
      Cancelar
    </button>
  </div>
</div>

<!-- Google Identity -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Auth utils -->
<script src="js/auth-utils.js?v=3"></script>

<script>
const MAX_MB = 10;

const btn = document.getElementById("btnContinuar");
const estado = document.getElementById("estado");
const audioInput = document.getElementById("audio");
const previewAudio = document.getElementById("previewAudio");
const loginOverlay = document.getElementById("loginOverlay");
const cancelLogin = document.getElementById("cancelLogin");

// 🎧 Preescucha + info del audio
audioInput.addEventListener("change", () => {
  if (audioInput.files.length > 0) {
    const audio = audioInput.files[0];
    const sizeMB = audio.size / 1024 / 1024;

    previewAudio.src = URL.createObjectURL(audio);

    if (sizeMB > MAX_MB) {
      estado.innerHTML = `
        ❌ El audio pesa <b>${sizeMB.toFixed(2)} MB</b><br>
        El máximo permitido es <b>${MAX_MB} MB</b>
      `;
      audioInput.value = "";
      return;
    }

    estado.innerHTML = `
      🎧 Audio cargado correctamente<br>
      <small>
        Tipo: <b>${audio.type || "desconocido"}</b><br>
        Tamaño: <b>${sizeMB.toFixed(2)} MB</b> / ${MAX_MB} MB
      </small>
    `;
  }
});

// 🚀 Click en continuar
btn.addEventListener("click", () => {
  const nombre = document.getElementById("nombre").value.trim();
  const audio = audioInput.files[0];

  if (!nombre || !audio) {
    estado.textContent = "⚠️ Completá el nombre y grabá un audio";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Procesando...";

  const token = localStorage.getItem("authToken");

  // 🔐 No logueado → pedir Google
  if (!token) {
    btn.disabled = false;
    btn.textContent = "Continuar";
    mostrarLoginGoogle();
    return;
  }

  crearRecuerdo(token, nombre, audio);
});

// 🔐 Mostrar login Google
function mostrarLoginGoogle() {
  loginOverlay.classList.remove("oculto");

  google.accounts.id.initialize({
    client_id: "892308582344-6ms0bnobi61nk5vabum1bf94her4p3gu.apps.googleusercontent.com",
    callback: async (response) => {
      try {
        const res = await fetch("https://api.reqrdito.com/api/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: response.credential })
        });

        const data = await res.json();

        if (!data.authToken) {
          throw new Error("No se pudo iniciar sesión");
        }

        localStorage.setItem("authToken", data.authToken);
        loginOverlay.classList.add("oculto");

        btn.disabled = false;
        btn.textContent = "Continuar";
        btn.click();

      } catch (err) {
        alert("Error iniciando sesión con Google");
        btn.disabled = false;
        btn.textContent = "Continuar";
      }
    }
  });

  google.accounts.id.renderButton(
    document.getElementById("googleLogin"),
    { theme: "outline", size: "large" }
  );
}

// ❌ Cancelar login
cancelLogin.onclick = () => {
  loginOverlay.classList.add("oculto");
  btn.disabled = false;
  btn.textContent = "Continuar";
};

// 📤 Crear recuerdo
async function crearRecuerdo(token, nombre, audio) {
  const formData = new FormData();
  formData.append("nombre", nombre);
  formData.append("audio", audio);

  estado.textContent = "⏳ Creando recuerdo...";

  try {
    const res = await fetch("https://api.reqrdito.com/api/upload", {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`
      },
      body: formData
    });

    const raw = await res.text();

    let data;
    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("Respuesta inválida del servidor");
    }

    if (!res.ok || !data.id) {
      throw new Error(data.error || "Error creando recuerdo");
    }

    window.location.href = `pago.html?id=${data.id}`;

  } catch (err) {
    console.error(err);
    estado.innerHTML = `
      ❌ Error creando el recuerdo<br>
      <small>${err.message}</small>
    `;
    btn.disabled = false;
    btn.textContent = "Continuar";
  }
}
</script>

</body>
</html>
