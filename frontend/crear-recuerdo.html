<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear recuerdo | ReQRdito</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">

<link rel="apple-touch-icon" href="/img/favicon-64x64.png">

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#6BAC73">
  <link rel="stylesheet" href="css/main.css?v=2026.1500">
  <!-- Meta Pixel Code -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1037382502691718');
  fbq('track', 'PageView');
  // Entró a armar un recuerdo (solo navegador: no hay compra ni pago todavía)
  fbq('track', 'ViewContent', { content_name: 'Crear recuerdo', content_type: 'product' });
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1037382502691718&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->
</head>
<body class="crear-body">

<div class="crear-card">
  <h1>Crear tu recuerdo</h1>
  <p>Elegí el tipo de recuerdo y subí tus audios</p>

  <div class="pack-selector">
    <button type="button" class="pack-btn active" data-pack="individual">
      Individual<br><small>1 audio · 1 QR</small>
    </button>

    <button type="button" class="pack-btn" data-pack="pareja">
      Dúo<br><small>2 audios · 1 QR</small>
    </button>
  </div>

  <form>
    <div class="form-group">
      <label>Nombre del recuerdo</label>
      <input type="text" id="nombre" required>
    </div>

   <div class="form-group">
  <label>Audio principal</label>

  <input type="file" id="audio1">

  

  <!-- 👇 UN SOLO AUDIO -->
  <audio id="preview1" controls></audio>

  <button type="button" onclick="grabarAudio1()">Grabar</button>
  <div id="recIndicator1" class="rec-indicator hidden">
  <span class="rec-dot"></span> Grabando...
</div>
<button type="button" onclick="detenerAudio1()">Detener</button>

</div>
    <div class="form-group oculto" id="grupoAudio2">
  <label>Segundo audio</label>

  <input type="file" id="audio2">


  <!-- 👇 UN SOLO AUDIO -->
  <audio id="preview2" controls></audio>

  <button type="button" onclick="grabarAudio2()">Grabar</button>
  <div id="recIndicator2" class="rec-indicator hidden">
  <span class="rec-dot"></span> Grabando...
</div>
<button type="button" onclick="detenerAudio2()">Detener</button>

</div>

    <button type="button" id="btnContinuar">Continuar</button>
    <p id="estado"></p>
  </form>
</div>

<!-- MODAL LOGIN -->
<div id="loginModal" class="rq-modal-overlay">
  <div class="rq-modal-card">
    <h2>Iniciá sesión para continuar</h2>
    <p>Iniciá sesión con Google para guardar tu recuerdo. Lo que cargaste no se pierde: al ingresar te llevamos directo al pago.</p>
    <p id="loginEstado" class="rq-modal-aviso" role="status"></p>
    <div id="googleBtn" class="rq-google-btn"></div>
    <button type="button" id="btnCancelar">Cancelar</button>
  </div>
</div>

<script src="js/config.js?v=2026.1600"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<script src="js/auth-init.js?v=2026.1600"></script>
<script src="js/crear-recuerdo.js?v=2026.1600"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
if (window.lucide) {
  lucide.createIcons();
}
</script>

<!-- Sin #sessionModal a propósito: su botón lleva a index.html y se perdería lo cargado.
     Si la sesión vence, al tocar "Continuar" se pide el login acá mismo. -->
</body>
</html>
