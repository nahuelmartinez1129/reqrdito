 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">

<link rel="apple-touch-icon" href="/img/favicon-64x64.png">

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#6BAC73">
<title>Generador de llaveros</title>
<link rel="stylesheet" href="css/main.css?v=2026.500">

<style>
body{
  font-family: Arial;
  padding: 20px;
  background:#f5f5f5;
}

h1{
  margin-bottom:20px;
}

input, select, button{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  cursor:pointer;
  background:#6BAC73;
  color:white;
  border:none;
}

button:hover{
  background:#166D20;
}

.btn-pdf{
  background:#EBAF2B;
}

.btn-limpiar{
  background:#c0392b;
}

pre{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>Generar llaveros</h1>

<!-- Solo emails incluidos en ADMIN_EMAILS (backend) pueden usar este panel -->
<div id="googleLogin"></div>

<label>Cantidad</label>
<input id="cantidad" type="number" value="10">

<label>Pack</label>
<select id="pack">
  <option value="individual">Individual</option>
  <option value="pareja">Dúo</option>
</select>

<br><br>

<button onclick="generar()">➕ Agregar QR</button>

<button class="btn-pdf" onclick="generarPDF()">📄 Generar PDF</button>

<button class="btn-limpiar" onclick="limpiar()">🧹 Limpiar</button>

<pre id="resultado"></pre>

<script src="js/config.js?v=2026.1600"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/auth-init.js?v=2026.1600"></script>

<script>

const API = `${REQRDITO.API}/api/keychain-admin`;

// Todas las llamadas llevan la sesión; 401/403 se informan sin reintentar
async function llamar(endpoint, opciones = {}) {
  const token = auth.getToken();
  if (!token) throw new Error("Iniciá sesión con una cuenta administradora");

  const res = await fetch(API + endpoint, {
    ...opciones,
    headers: { ...(opciones.headers || {}), Authorization: `Bearer ${token}` }
  });

  if (res.status === 401) {
    auth.clearToken();
    auth.updateHeaderUI("googleLogin");
    throw new Error("Sesión vencida: volvé a iniciar sesión");
  }
  if (res.status === 403) throw new Error("Tu cuenta no tiene permisos de administración");

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || "Error del servidor");
  }

  return res;
}

async function mostrarTanda() {
  try {
    const data = await (await llamar("/tanda")).json();
    document.getElementById("resultado").textContent = `Llaveros en la tanda: ${data.total}`;
  } catch (err) {
    document.getElementById("resultado").textContent = err.message;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  auth.initHeader("googleLogin");
  if (auth.isLogged()) mostrarTanda();
});
document.addEventListener("loginSuccess", mostrarTanda);

// ===============================
// ✅ GENERAR (ACUMULA)
// ===============================
async function generar(){

  const cantidad = parseInt(document.getElementById("cantidad").value);
  const pack = document.getElementById("pack").value;

  if(!cantidad || cantidad <= 0){
    alert("Ingresá una cantidad válida");
    return;
  }

  let endpoint = "";

  if(pack === "individual"){
    endpoint = "/generar-individuales";
  } else {
    endpoint = "/generar-pareja";
  }

  try{

    const res = await llamar(endpoint,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({ cantidad })
    });

    const data = await res.json();

    document.getElementById("resultado").textContent =
      JSON.stringify(data,null,2);

  }catch(err){
    console.error(err);
    alert(err.message || "Error generando QR");
  }

}


// ===============================
// 📄 GENERAR PDF FINAL
// ===============================
async function generarPDF(){

  try{

    const res = await llamar("/generar-pdf");

    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "llaveros-qr.pdf";
    a.click();
    setTimeout(() => window.URL.revokeObjectURL(url), 1000);

  }catch(err){
    console.error(err);
    alert(err.message || "Error generando PDF");
  }

}


// ===============================
// 🧹 LIMPIAR LISTA
// ===============================
async function limpiar(){

  try{

    await llamar("/limpiar",{
      method:"POST"
    });

    document.getElementById("resultado").textContent =
      "Lista limpiada";

  }catch(err){
    console.error(err);
    alert(err.message || "Error al limpiar");
  }

}

</script>

</body>
</html>
