<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Recuerdo creado | ReQRdito</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/main.css" />
</head>

<body class="crear-body">

  <div class="crear-card exito-card">

    <h1>💚 ¡Tu recuerdo está listo!</h1>
    <p class="subtitle">
      Gracias por confiar en ReQRdito.  
      Este recuerdo ya vive para siempre en un código QR.
    </p>

    <!-- 🔲 QR -->
    <div class="qr-box">
      <img id="qrImg" alt="Código QR del recuerdo">
      <p class="qr-label">Escaneá este QR para escuchar el recuerdo</p>
    </div>

    <!-- 🔗 LINK -->
    <div class="link-box">
      <p class="label">Link directo al recuerdo</p>
      <input type="text" id="linkRecuerdo" readonly>
      <button id="copiarLink">📋 Copiar link</button>
    </div>

    <!-- 📝 INFO -->
    <div class="info-box">
      <p>✔ Podés imprimir este QR</p>
      <p>✔ Ideal para llaveros o regalos</p>
      <p>✔ El acceso es permanente</p>
    </div>

    <p id="estado"></p>

  </div>

<script>
const params = new URLSearchParams(window.location.search);
const recuerdoId = params.get("id");

const qrImg = document.getElementById("qrImg");
const linkInput = document.getElementById("linkRecuerdo");
const copiarBtn = document.getElementById("copiarLink");
const estado = document.getElementById("estado");

if (!recuerdoId) {
  estado.textContent = "❌ Recuerdo no encontrado";
} else {
  // ⚠️ usamos datos ya conocidos
  const qrUrl = `http://localhost:5000/uploads/qr/${recuerdoId}.png`;
  const link = `http://localhost:5000/r/${recuerdoId}`;

  qrImg.src = qrUrl;
  linkInput.value = link;
}

copiarBtn.addEventListener("click", () => {
  linkInput.select();
  document.execCommand("copy");
  copiarBtn.textContent = "✅ Copiado";
  setTimeout(() => copiarBtn.textContent = "📋 Copiar link", 2000);
});
</script>

</body>
</html>
