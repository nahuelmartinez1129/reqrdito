<body class="recuerdo-body">

  <div class="recuerdo-card" id="card">
    <h1 id="titulo">⏳ Tu recuerdo se está preparando</h1>

    <p class="subtitle" id="mensaje">
      Estamos confirmando tu pago.<br>
      Esto puede tardar unos segundos.
    </p>

    <div id="spinner" class="spinner"></div>

    <div id="contenido" class="contenido" style="display:none">
      <!-- foto, nombre, contador, mensaje, audios y canción (js/recuerdo-vista.js) -->
      <div id="vista" class="rv"></div>

      <div id="audioContainer"></div>

      <div class="rv-qr">
        <img id="qrImg" alt="Código QR del recuerdo" />
        <p>Escaneá o compartí este código para volver a este recuerdo.</p>
      </div>
    </div>
  </div>

<script src="js/config.js?v=2026.1600"></script>
<script src="js/recuerdo-vista.js?v=2026.1020"></script>
<script>
const params = new URLSearchParams(window.location.search);

const id = params.get("id") || params.get("key");
const tipo = params.get("tipo"); // 🔥 NUEVO

const titulo = document.getElementById("titulo");
const mensaje = document.getElementById("mensaje");
const contenido = document.getElementById("contenido");
const qrImg = document.getElementById("qrImg");
const audioContainer = document.getElementById("audioContainer");

if (!id) {
  document.getElementById("card").innerHTML = `
    <h1>❌ Recuerdo inválido</h1>
    <p>No se pudo cargar este recuerdo.</p>
  `;
} else {

  // 🔥 =========================
  // 🔥 CASO EVENTO (NUEVO)
  // 🔥 =========================

  if (tipo === "evento") {

    cargarEvento();

  } else {

    // 🔵 FLUJO ORIGINAL (NO TOCADO)
    let intentos = 0;
    const maxIntentos = 12;

    const intervalo = setInterval(async () => {
      intentos++;

      try {
        const res = await fetch(`${REQRDITO.API}/api/recuerdo/${encodeURIComponent(id)}`);
        const data = await res.json();

        if (data.pagado) {
          clearInterval(intervalo);
          mostrarRecuerdo(data);
          return;
        }

        if (intentos >= maxIntentos) {
          clearInterval(intervalo);
          titulo.textContent = "⏳ Seguimos preparando tu recuerdo";
          mensaje.innerHTML = `
            El pago fue recibido, pero la confirmación está demorando un poco.<br>
            Podés volver más tarde o verlo desde <b>Mis recuerdos</b>.
          `;
        }

      } catch (err) {
        clearInterval(intervalo);
        titulo.textContent = "❌ Error";
        mensaje.textContent = "No se pudo cargar el recuerdo.";
      }

    }, 3000);
  }
}

/* =========================
   🔥 NUEVO: EVENTOS
========================= */
async function cargarEvento() {

  try {

    // /events/audio-data no existe: el backend expone /events/qr-data (módulo hoy deshabilitado)
    const res = await fetch(`${REQRDITO.API}/events/qr-data/${encodeURIComponent(id)}`);

    // Eventos deshabilitado temporalmente (el backend responde 503): aviso claro
    if (res.status === 503) {
      document.getElementById("spinner").style.display = "none";
      titulo.textContent = "Recuerdo no disponible por ahora";
      mensaje.textContent = "Los recuerdos de eventos no están disponibles por el momento. Volvé a intentarlo más adelante.";
      return;
    }

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Evento no disponible");

    mostrarEvento(data);

  } catch (err) {
    console.error(err);
    titulo.textContent = "❌ Error";
    mensaje.textContent = "No se pudo cargar el recuerdo.";
  }
}

function mostrarEvento(data) {

  titulo.textContent = "🎧 Tu recuerdo está listo";
  mensaje.textContent = data.eventName
    ? `Recuerdo del evento: ${data.eventName}`
    : "Este recuerdo fue creado para vos 💚";

  document.getElementById("spinner").style.display = "none";
  contenido.style.display = "block";

  // ❌ eventos no tienen QR descargable por ahora
  qrImg.style.display = "none";
  descargarQr.style.display = "none";

  const audio = document.createElement("audio");
  audio.controls = true;
  audio.src = data.file;
  audio.className = "recuerdo-audio";

  audioContainer.appendChild(audio);
}

/* =========================
   ORIGINAL (NO TOCADO)
========================= */
function mostrarRecuerdo(data) {
  document.getElementById("spinner").style.display = "none";
  // el nombre y lo demás los muestra la vista; el encabezado de espera se oculta
  titulo.style.display = "none";
  mensaje.style.display = "none";
  document.getElementById("card").classList.add("recuerdo-card--listo");
  contenido.style.display = "block";

  qrImg.src = `${REQRDITO.API}${data.qrUrl}`;

  // recuerdos históricos con audioUrl en vez de audios[]
  if (!data.audios?.length && data.audioUrl) data.audios = [{ url: data.audioUrl, orden: 1 }];

  RecuerdoVista.mostrar(document.getElementById("vista"), data, { base: REQRDITO.API });
}
</script>

</body>
