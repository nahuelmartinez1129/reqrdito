<body class="recuerdo-body ejemplo-body">
  <script>if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("ejemplo-body--embed");</script>

  <div class="ejemplo-aviso" role="note">
    <span>👀 Esto es un ejemplo: así lo ve quien escanea tu QR</span>
    <a href="crear-recuerdo.html" class="ejemplo-aviso-btn">Crear el mío</a>
  </div>

  <div class="recuerdo-card recuerdo-card--listo">
    <div class="contenido">
      <div id="vista" class="rv"></div>
      <div class="rv-qr">
        <img src="ejemplo/qr.png" alt="Código QR de este ejemplo" width="180" height="180" />
        <p>Escanealo con tu celular para verlo como lo vería quien recibe tu regalo.</p>
      </div>
    </div>
  </div>

  <a href="crear-recuerdo.html" class="ejemplo-cta">Quiero regalar uno así</a>

<script src="js/config.js?v=2026.1600"></script>
<script src="js/recuerdo-vista.js?v=2026.1020"></script>
<script>
  // Fecha de ejemplo: siempre "hace 3 años y unos meses", para que el contador se vea vivo
  const hoy = new Date();
  const desde = new Date(hoy.getFullYear() - 3, hoy.getMonth() - 4, 15);
  const dos = n => String(n).padStart(2, "0");

  RecuerdoVista.mostrar(document.getElementById("vista"), {
    nombre: "Para Sofi, en nuestro aniversario",
    fotos: [
      { url: "ejemplo/foto.svg", orden: 1 },
      { url: "ejemplo/foto2.svg", orden: 2 },
      { url: "ejemplo/foto3.svg", orden: 3 }
    ],
    fecha: `${desde.getFullYear()}-${dos(desde.getMonth() + 1)}-${dos(desde.getDate())}`,
    fechaTitulo: "Juntos desde",
    mensaje: "Gracias por cada mate, cada viaje y cada domingo de lluvia.\nMi lugar favorito sigue siendo al lado tuyo.\n\nTe amo. — Tomi",
    audios: [{ url: "ejemplo/voz.mp3", orden: 1 }],
    cancionUrl: "https://open.spotify.com/track/34gCuhDGsG4bRPIf9bb02f"
  });
</script>

</body>
