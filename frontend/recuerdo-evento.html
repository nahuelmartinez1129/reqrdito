<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Recuerdo | ReQRdito</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #6BAC73, #166D20);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: #F9ECD9;
  color: #166D20;
  padding: 25px;
  border-radius: 20px;
  width: 90%;
  max-width: 400px;
  text-align: center;
}

h1 {
  margin-bottom: 10px;
}

audio {
  width: 100%;
  margin-top: 15px;
}

.loader {
  font-size: 18px;
}

.empty {
  font-size: 16px;
  color: #999;
}
</style>

<body>

<div class="card">

  <h1>🎧 Recuerdo</h1>

  <div id="content">
    <p class="loader">Cargando...</p>
  </div>

</div>

<script src="js/config.js?v=2026.1600"></script>
<script>

const params = new URLSearchParams(window.location.search);
const qrId = params.get("qr");

const content = document.getElementById("content");

async function load() {
  try {
    const res = await fetch(`${REQRDITO.API}/events/qr-data/${encodeURIComponent(qrId || "")}`);

    // Eventos deshabilitado temporalmente (el backend responde 503): aviso claro
    if (res.status === 503) {
      content.innerHTML = `
        <p class="empty">Los recuerdos de eventos no están disponibles por el momento. Volvé a intentarlo más adelante.</p>
        <p><a href="${REQRDITO.SITIO}/">Ir a ReQRdito</a></p>
      `;
      return;
    }

    const data = await res.json();

    if (!data || data.status === "empty") {
      content.innerHTML = `
        <p class="empty">Este recuerdo aún no fue grabado 🎤</p>
      `;
      return;
    }

    // nombre y archivo vienen del servidor: se insertan como texto/atributo, nunca como HTML
    const titulo = document.createElement("h2");
    titulo.textContent = data.name || "";
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.autoplay = true;
    const source = document.createElement("source");
    source.src = data.file || "";
    source.type = "audio/webm";
    audio.appendChild(source);
    content.replaceChildren(titulo, audio);

  } catch (err) {
    content.innerHTML = `
      <p>Error cargando el recuerdo</p>
    `;
    console.error(err);
  }
}

load();

</script>

</body>
</html>
