<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pago | ReQRdito</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/main.css" />
</head>

<body class="crear-body">

  <div class="crear-card pago-card">

    <h1>Confirmar tu recuerdo</h1>
    <p class="subtitle">
      Estás a un paso de crear un recuerdo único y eterno 💚
    </p>

    <!-- 🧾 RESUMEN DEL PRODUCTO -->
    <div class="producto-resumen">
      <h3>🎧 Recuerdo en QR</h3>
      <ul>
        <li>✔ Audio privado</li>
        <li>✔ Código QR único</li>
        <li>✔ Acceso permanente</li>
        <li>✔ Ideal para regalos y llaveros</li>
      </ul>
    </div>

    <!-- 💰 PRECIO -->
    <div class="precio-box">
      <span>Total</span>
      <strong>$1.000 ARS</strong>
    </div>

    <!-- 🔐 SEGURIDAD -->
    <div class="seguridad">
      🔒 Pago seguro procesado por Mercado Pago
    </div>

    <!-- 💳 BOTÓN -->
    <button id="pagarBtn" class="btn-pagar">
      💳 Pagar recuerdo
    </button>

    <p id="estado" style="margin-top:15px;"></p>

  </div>

<script>
/* =========================
   PAGO CON MERCADO PAGO
   ========================= */

const estado = document.getElementById("estado");
const pagarBtn = document.getElementById("pagarBtn");

// obtener id del recuerdo desde la URL
const params = new URLSearchParams(window.location.search);
const recuerdoId = params.get("id");

pagarBtn.addEventListener("click", async () => {
  estado.textContent = "⏳ Redirigiendo a Mercado Pago...";
  pagarBtn.disabled = true;

  try {
    const res = await fetch("http://localhost:5000/api/crear-preferencia", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        titulo: "Recuerdo en QR",
        recuerdoId
      })
    });

    const data = await res.json();

    if (!res.ok || !data.init_point) {
      throw new Error("Error creando pago");
    }

    // 🔥 Redirección real al checkout
    window.location.href = data.init_point;

  } catch (err) {
    console.error(err);
    estado.textContent = "❌ Error iniciando el pago";
    pagarBtn.disabled = false;
    pagarBtn.textContent = "💳 Pagar recuerdo";
  }
});
</script>

</body>
</html>
