<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu recuerdo ReQRdito está listo</title>
</head>
<body style="margin:0;padding:0;background:#f4f1ea;font-family:Arial,Helvetica,sans-serif;color:#2b2b2b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ea;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background:#6BAC73;padding:24px;text-align:center;color:#ffffff;font-size:22px;font-weight:bold;">
              ReQRdito
            </td>
          </tr>
          <tr>
            <td style="padding:28px 24px;">
              <h1 style="margin:0 0 12px;font-size:20px;">🎧 Tu recuerdo está listo</h1>
              <p style="margin:0 0 16px;line-height:1.5;">
                Ya podés escucharlo, compartirlo y descargar su código QR.
              </p>
              <p style="margin:0 0 24px;text-align:center;">
                <a href="{{LINK_RECUERDO}}" style="display:inline-block;background:#EBAF2B;color:#2b2b2b;text-decoration:none;font-weight:bold;padding:12px 24px;border-radius:24px;">
                  Ver mi recuerdo
                </a>
              </p>
              <p style="margin:0 0 8px;font-size:13px;color:#666;">Código de tu recuerdo:</p>
              <p style="margin:0 0 16px;font-family:monospace;font-size:13px;word-break:break-all;">{{CODIGO}}</p>
              <p style="margin:0;font-size:13px;color:#666;line-height:1.5;">
                También lo encontrás siempre en <strong>Mis recuerdos</strong>, iniciando sesión con tu cuenta de Google.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;background:#faf8f3;font-size:12px;color:#888;text-align:center;">
              Hay palabras que merecen quedarse. · reqrdito.com
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
